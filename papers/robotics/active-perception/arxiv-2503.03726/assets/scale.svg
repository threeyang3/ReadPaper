<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-label="目标远近导致图像尺度变化，先估计深度再做标准尺度轮廓匹配"><rect width="900" height="385" rx="18" fill="#f8fafc"/><g font-family="Arial, Noto Sans CJK SC, sans-serif" text-anchor="middle"><text x="170" y="42" font-size="22" font-weight="bold" fill="#334155">较近：轮廓更大</text><text x="462" y="42" font-size="22" font-weight="bold" fill="#334155">较远：轮廓更小</text><text x="760" y="42" font-size="22" font-weight="bold" fill="#334155">规范化后</text></g><g stroke-width="3"><rect x="65" y="78" width="213" height="201" rx="10" fill="#eff6ff" stroke="#94a3b8"/><rect x="360" y="78" width="213" height="201" rx="10" fill="#eff6ff" stroke="#94a3b8"/><rect x="655" y="78" width="213" height="201" rx="10" fill="#e0f2fe" stroke="#0284c7"/><path d="M110 236L121 114H230L237 236Z" fill="#3b82f6" fill-opacity=".18" stroke="#2563eb"/><path d="M417 208L424 153H498L503 208Z" fill="#3b82f6" fill-opacity=".18" stroke="#2563eb"/><path d="M706 237L718 113H808L821 237Z" fill="#3b82f6" fill-opacity=".18" stroke="#2563eb"/></g><path d="M283 170H344M578 170H641" stroke="#64748b" stroke-width="3"/><path d="M344 170l-12 -8v16Z M641 170l-12 -8v16Z" fill="#64748b"/><g font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="18" fill="#475569" text-anchor="middle"><text x="170" y="311">z 小，像素投影大</text><text x="464" y="311">z 大，像素投影小</text><text x="761" y="311">使用深度缩放到模板尺度</text><text x="450" y="357" fill="#2563eb">l_s = (z_r / z_s) × l_r</text></g></svg>

