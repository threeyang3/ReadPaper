<path d="M260 266H309" class="line"/><path d="M260 141H620V239" class="line"/><path d="M539 266H620" class="line"/>
<rect x="617" y="210" rx="16" ry="16" width="226" height="106" class="box blue"/>
<text x="730" y="246" class="st" text-anchor="middle">统一可渲染物体</text>
<text x="730" y="273" class="small" text-anchor="middle">网格 + RGB-D 渲染</text>
<rect x="40" y="374" rx="16" ry="16" width="250" height="95" class="box green"/>
<text x="165" y="405" class="st" text-anchor="middle">实时 RGB-D + K</text>
<text x="165" y="431" class="small" text-anchor="middle">首帧 Mask / Depth</text>
<rect x="340" y="374" rx="16" ry="16" width="235" height="95" class="box"/>
<text x="457" y="405" class="st" text-anchor="middle">多姿态初始假设</text>
