<text x="150" y="134" class="st" text-anchor="middle">已知 CAD</text>
<text x="150" y="160" class="small" text-anchor="middle">textured mesh</text>
<rect x="40" y="214" rx="16" ry="16" width="220" height="105" class="box purple"/>
<text x="150" y="251" class="st" text-anchor="middle">参考 RGB-D</text>
<text x="150" y="278" class="small" text-anchor="middle">Mask / 参考相机位姿</text>
<rect x="309" y="214" rx="16" ry="16" width="230" height="105" class="box purple"/>
<text x="424" y="250" class="st" text-anchor="middle">SDF 物体建模</text>
