<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<style>
text {font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#16304c}
.title{font-size:28px;font-weight:700}
.st{font-size:18px;font-weight:700}
.small{font-size:15px;fill:#52697e}
.box{fill:#f6f9fc;stroke:#d3e2f0;stroke-width:2}
.blue{fill:#e7f2ff;stroke:#4f96e4}
.green{fill:#e8f9f0;stroke:#29a178}
.purple{fill:#f2edff;stroke:#9076df}
.line{fill:none;stroke:#7791aa;stroke-width:3;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7791aa"/></marker></defs>
<rect width="1200" height="560" fill="white"/>
<text x="45" y="52" class="title">FoundationPose：统一位姿估计 / 跟踪（阅读示意）</text>
